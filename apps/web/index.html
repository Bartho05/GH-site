<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GH Roleplay — Loja PvP</title>
  <meta name="description" content="Loja do GH Roleplay: produtos digitais com entrega instantânea, suporte 24/7 e promoções toda semana.">

  <!-- Fonte -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- App (React via Vite) -->
  <script type="module" src="/src/loja/main.jsx"></script>

  <!-- Tema salvo aplicado antes da pintura (evita troca de cor piscando) -->
  <script>
    (function () {
      try {
        var salvo = localStorage.getItem('gh_tema');
        if (['laranja', 'rosa', 'verde'].indexOf(salvo) >= 0 && salvo !== 'laranja') {
          document.documentElement.dataset.tema = salvo;
        }
        var anim = localStorage.getItem('gh_anim');
        if (anim === 'off') document.documentElement.dataset.anim = 'off';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="raiz"></div>
</body>
</html>
