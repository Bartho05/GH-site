<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GH Roleplay — Loja PvP</title>
  <meta name="description" content="Loja do GH Roleplay: produtos digitais com entrega instantânea, suporte 24/7 e promoções toda semana.">

  <!-- Fonte -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- App (React via Vite) -->
  <script type="module" src="/src/main.jsx"></script>

  <!-- Tema/idioma/moeda/cursor salvos aplicados antes da pintura (evita piscar) -->
  <script>
    (function () {
      try {
        var salvo = localStorage.getItem('gh_tema');
        if (['laranja', 'rosa', 'halloween', 'verde'].indexOf(salvo) >= 0 && salvo !== 'laranja') {
          document.documentElement.dataset.tema = salvo;
        }
        var anim = localStorage.getItem('gh_anim');
        if (anim === 'off') document.documentElement.dataset.anim = 'off';
        var idioma = localStorage.getItem('gh_idioma');
        if (idioma) {
          document.documentElement.dataset.idioma = idioma;
          document.documentElement.lang = idioma === 'pt' ? 'pt-BR' : idioma;
        }
        var moeda = localStorage.getItem('gh_moeda');
        if (moeda) document.documentElement.dataset.moeda = moeda;
        var cursor = localStorage.getItem('gh_cursor');
        if (cursor) document.documentElement.dataset.cursor = cursor;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="raiz"></div>
</body>
</html>
